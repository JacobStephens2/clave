<VirtualHost *:80>
  ServerName clave.dance

  ProxyRequests Off
  ProxyPreserveHost On

  # Keep this rule before the catch-all. Apache 2.4.47+ can perform the
  # WebSocket upgrade through mod_proxy_http.
  ProxyPass "/ws" "http://127.0.0.1:8787/ws" upgrade=websocket timeout=600
  ProxyPassReverse "/ws" "http://127.0.0.1:8787/ws"

  ProxyPass "/" "http://127.0.0.1:8787/" connectiontimeout=5 timeout=60
  ProxyPassReverse "/" "http://127.0.0.1:8787/"

  ErrorLog ${APACHE_LOG_DIR}/clave-error.log
  CustomLog ${APACHE_LOG_DIR}/clave-access.log combined
</VirtualHost>
