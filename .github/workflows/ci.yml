name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: bash ops/test-workflow-pins.sh
      - run: bash ops/test-package-release.sh
      - run: node ops/test-validate-release.mjs
      - run: shellcheck ops/*.sh
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package the verified release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: bash ops/package-release.sh "$DEPLOY_COMMIT" "$RUNNER_TEMP/clave-release.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: production-release
          path: ${{ runner.temp }}/clave-release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://clave.dance
    concurrency:
      group: clave-production
      cancel-in-progress: false
    steps:
      - name: Reject superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$latest" != "$DEPLOY_COMMIT" ]]; then
            echo "::error::A newer default-branch commit exists; its workflow will deploy instead."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-release
      - name: Deploy the exact verified build over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLAVE_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CLAVE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/clave-deploy-key"
          hosts_file="$RUNNER_TEMP/clave-deploy-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            clave-deploy@stephens.page "deploy $DEPLOY_COMMIT" < clave-release.tgz
      - name: Verify the public release
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            https://clave.dance/healthz | jq -e '.ok == true and .service == "clave"'
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "https://clave.dance/release.json?commit=$DEPLOY_COMMIT" \
            | jq -e '.commit == env.DEPLOY_COMMIT'
          printf 'Deployed %s to https://clave.dance\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"
